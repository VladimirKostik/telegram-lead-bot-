services:
  db:
    image: postgres:16-alpine
    container_name: telegram_lead_bot_db

    environment:
      POSTGRES_DB: lead_bot
      POSTGRES_USER: lead_bot
      POSTGRES_PASSWORD: lead_bot_password

    ports:
        - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_bot -d lead_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: